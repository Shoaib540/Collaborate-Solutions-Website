<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collaborate Solutions — Product UI Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", system-ui, sans-serif; background: #0a2a20; color: #0f172a; overflow: hidden; }
    .stage { width: 100vw; height: 100vh; display: grid; place-items: center; padding: 24px; }
    .frame {
      width: min(1280px, 96vw); aspect-ratio: 16/9; background: #fff; border-radius: 12px;
      overflow: hidden; box-shadow: 0 40px 100px rgba(0,0,0,.45); position: relative;
      border: 1px solid rgba(255,255,255,.12);
    }
    .chrome { height: 42px; background: #f1f5f4; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; gap: 8px; padding: 0 14px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #cbd5e1; }
    .dot.r { background: #f87171; } .dot.y { background: #fbbf24; } .dot.g { background: #34d399; }
    .url { margin-inline-start: 10px; flex: 1; height: 24px; border-radius: 6px; background: #fff; border: 1px solid #e2e8f0; font-size: 12px; color: #64748b; display: flex; align-items: center; padding: 0 10px; }
    .screen { width: 100%; height: calc(100% - 42px); object-fit: cover; object-position: top center; display: none; }
    .screen.active { display: block; }
    .badge {
      position: absolute; left: 18px; bottom: 18px; background: rgba(15,61,46,.92); color: #fff;
      padding: 10px 14px; border-radius: 8px; font-size: 13px; font-weight: 700; letter-spacing: .02em;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }
    .badge small { display: block; margin-top: 2px; font-weight: 500; opacity: .8; font-size: 11px; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="frame">
      <div class="chrome">
        <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
        <div class="url" id="url">app.collaboratesolutions.com/dashboard</div>
      </div>
      <img class="screen active" id="screen" src="/media/images/ehr-soft-dashboard.jpg" alt="EHR UI" />
      <div class="badge" id="badge">Clinical Dashboard<small>Real-time patient census & tasks</small></div>
    </div>
  </div>
  <script>
    const slides = [
      { src: '/media/images/ehr-soft-dashboard.jpg', url: 'app.collaboratesolutions.com/dashboard', title: 'Clinical Dashboard', sub: 'Real-time patient census & tasks' },
      { src: '/media/images/ehr-soft-chart.jpg', url: 'app.collaboratesolutions.com/chart/10482', title: 'Patient Chart', sub: 'SOAP notes, meds, allergies, vitals' },
      { src: '/media/images/ehr-soft-schedule.jpg', url: 'app.collaboratesolutions.com/schedule', title: 'Practice Scheduling', sub: 'Multi-provider calendar & check-in' },
      { src: '/media/images/ehr-soft-billing.jpg', url: 'app.collaboratesolutions.com/billing/claims', title: 'Revenue Cycle', sub: 'Claims, denials, collections' },
      { src: '/media/images/ehr-soft-telehealth.jpg', url: 'app.collaboratesolutions.com/telehealth/visit', title: 'Telehealth Workspace', sub: 'Visit + chart in one screen' },
      { src: '/media/images/ehr-soft-interop.jpg', url: 'app.collaboratesolutions.com/exchange/fhir', title: 'FHIR & NPHIES Exchange', sub: 'Interoperability control center' },
    ]
    let i = 0
    const screen = document.getElementById('screen')
    const url = document.getElementById('url')
    const badge = document.getElementById('badge')
    function show(n) {
      const s = slides[n]
      screen.classList.remove('active')
      setTimeout(() => {
        screen.src = s.src
        url.textContent = s.url
        badge.innerHTML = `${s.title}<small>${s.sub}</small>`
        screen.classList.add('active')
      }, 180)
    }
    setInterval(() => { i = (i + 1) % slides.length; show(i) }, 2800)
  </script>
</body>
</html>
